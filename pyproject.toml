[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fver"
version = "0.1.0"
description = "LLM-driven formal verification of C codebases: prove absence of undefined behaviour, one function at a time."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "anthropic>=1.0",
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2",
  "tomli-w>=1.0",
  "tree-sitter>=0.23",
  "tree-sitter-c>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy"]
mcp = ["mcp>=1.2"]

[project.scripts]
fver = "fver.cli:main"

# Backends are discovered through this entry-point group. Third-party packages
# can register their own backend here.
[project.entry-points."fver.backends"]
refinedc = "fver.backends.refinedc.backend:RefinedCBackend"
null = "fver.backends.null:NullBackend"

[tool.hatch.build.targets.wheel]
packages = ["src/fver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "S110", "PLW1510"]
ignore = ["B008", "E501", "UP042"]  # typer defaults; formatter owns line length; str-Enum is deliberate

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "BLE"]
