name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python ${{ matrix.python }} .venv
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/ruff format --check src tests
      - run: .venv/bin/python -m pytest -q

  installer:
    name: get-fver.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck -s sh get-fver.sh install.sh
      - name: install from this checkout the way users will
        env:
          FVER_REPO: file://${{ github.workspace }}
          FVER_REF: ${{ github.sha }}
        run: |
          sh get-fver.sh
          export PATH="$HOME/.local/bin:$PATH"
          fver --version
          fver --help >/dev/null
      - name: smoke-run on a tiny C project with the null backend
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p /tmp/smoke/src && cd /tmp/smoke
          printf 'int add(int a, int b) { return a + b; }\nint main(void) { return add(1, 2); }\n' > src/m.c
          fver init --backend null
          fver scan
          printf '["```c file=function.c\\n/* FVER_ACCEPT */\\nint f(void){return 0;}\\n```"]' > .fver/fake.json
          FVER_FAKE_LLM=.fver/fake.json fver verify --parallel 1
          fver status
