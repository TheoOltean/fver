name: ci

# Budget-conscious: a push to main runs ONE small job (Linux, one Python).
# The cross-platform matrix and the installer test run only for version
# tags (v1.2.3) or when triggered by hand.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "PLAN.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: tests (linux, py3.11)
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.11 .venv
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/python -m pytest -q

  release:
    name: release checks (${{ matrix.os }}, py${{ matrix.python }})
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python ${{ matrix.python }} .venv
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/ruff format --check src tests
      - run: .venv/bin/python -m pytest -q
      - name: shellcheck installers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck -s sh get-fver.sh install.sh
      - name: install the way users will and smoke-run
        env:
          FVER_REPO: file://${{ github.workspace }}
          FVER_REF: ${{ github.sha }}
        run: |
          sh get-fver.sh
          export PATH="$HOME/.local/bin:$PATH"
          fver --version
          mkdir -p /tmp/smoke/src && cd /tmp/smoke
          printf 'int add(int a, int b) { return a + b; }\nint main(void) { return add(1, 2); }\n' > src/m.c
          fver init --backend null
          fver scan
          printf '["```c file=function.c\\n/* FVER_ACCEPT */\\nint f(void){return 0;}\\n```"]' > .fver/fake.json
          FVER_FAKE_LLM=.fver/fake.json fver verify --parallel 1
          fver status
